<title>Pipeline candidatures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="css">
:root{
  --ground:#F5F7F7; --surface:#FFFFFF; --surface-2:#EDF1F1;
  --ink:#111C21; --ink-2:#55686E; --ink-3:#8298A0;
  --line:#DBE3E4; --line-2:#C6D2D4;
  --accent:#0E6E6B; --accent-ink:#0A5451; --accent-soft:#DCEDEB;
  --star:#B8811A; --star-soft:#F7EBD2;
  --ok:#2C7A50; --ok-soft:#DCEDE2;
  --bad:#A24438; --bad-soft:#F3E0DD;
  --shadow:0 1px 2px rgba(17,28,33,.05), 0 4px 14px rgba(17,28,33,.04);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C1316; --surface:#131D21; --surface-2:#1A262B;
    --ink:#E2ECEE; --ink-2:#93A7AD; --ink-3:#6C8188;
    --line:#243237; --line-2:#31434A;
    --accent:#4FC0B5; --accent-ink:#7BD6CD; --accent-soft:#10312F;
    --star:#DDA63C; --star-soft:#3A2F16;
    --ok:#63B183; --ok-soft:#14301F;
    --bad:#CE7A6E; --bad-soft:#361D19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --ground:#0C1316; --surface:#131D21; --surface-2:#1A262B;
  --ink:#E2ECEE; --ink-2:#93A7AD; --ink-3:#6C8188;
  --line:#243237; --line-2:#31434A;
  --accent:#4FC0B5; --accent-ink:#7BD6CD; --accent-soft:#10312F;
  --star:#DDA63C; --star-soft:#3A2F16;
  --ok:#63B183; --ok-soft:#14301F;
  --bad:#CE7A6E; --bad-soft:#361D19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:32px 22px 64px; display:flex; flex-direction:column; gap:22px}

.masthead{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px}
.masthead h1{
  font-family:"Instrument Serif",Georgia,serif; font-weight:400;
  font-size:40px; line-height:1.05; margin:0; letter-spacing:.1px; text-wrap:balance;
}
.masthead .sub{margin:5px 0 0; color:var(--ink-2); font-size:14px}
.stamp{
  font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11.5px;
  color:var(--ink-3); text-align:right; letter-spacing:.2px;
}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr)); gap:10px}
.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 13px; display:flex; flex-direction:column; gap:3px; box-shadow:var(--shadow);
}
.stat .n{font-family:"JetBrains Mono",ui-monospace,monospace; font-size:23px; font-weight:500; font-variant-numeric:tabular-nums; line-height:1.1}
.stat .l{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-2)}
.stat[data-tone="accent"] .n{color:var(--accent)}
.stat[data-tone="ok"] .n{color:var(--ok)}
.stat[data-tone="star"] .n{color:var(--star)}

.toolbar{display:flex; flex-wrap:wrap; gap:9px; align-items:center}
.search{flex:1 1 250px; min-width:0; position:relative}
.search input{
  width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--line-2);
  background:var(--surface); color:var(--ink); font:inherit; font-size:14px;
}
.search input::placeholder{color:var(--ink-3)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  border-radius:999px; padding:6px 12px; font:inherit; font-size:12.5px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; transition:background .12s, color .12s, border-color .12s;
}
.chip .c{font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11px; font-variant-numeric:tabular-nums; color:var(--ink-3)}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--ground)}
.chip[aria-pressed="true"] .c{color:var(--ground); opacity:.7}

.tablewrap{
  overflow-x:auto; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
}
table{border-collapse:collapse; width:100%; min-width:860px}
thead th{
  text-align:left; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.07em;
  color:var(--ink-2); padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
  background:var(--surface-2);
}
tbody td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-exclue="1"]{opacity:.44}

.fav{
  background:none; border:0; cursor:pointer; padding:2px; line-height:1; font-size:17px;
  color:var(--ink-3); border-radius:6px;
}
.fav[aria-pressed="true"]{color:var(--star)}
.fav:hover{color:var(--star)}

.poste{display:flex; flex-direction:column; gap:2px; min-width:230px}
.poste .t{font-weight:600; font-size:14.5px; line-height:1.3}
.poste .e{font-size:12.5px; color:var(--ink-2)}
.poste .e .none{color:var(--ink-3); font-style:italic}

.score{
  font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
  font-size:13px; font-weight:500; padding:3px 9px; border-radius:999px; display:inline-block;
}
.score[data-hi="1"]{background:var(--accent); color:var(--surface)}
:root[data-theme="dark"] .score[data-hi="1"]{color:#0C1316}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .score[data-hi="1"]{color:#0C1316}}
.score[data-hi="0"]{background:transparent; color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}

select.statut{
  font:inherit; font-size:12.5px; padding:5px 8px; border-radius:7px;
  border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink); cursor:pointer;
  max-width:100%;
}
select.statut[data-s="Postulée"]{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent}
select.statut[data-s="Contacts en cours"]{background:var(--ok-soft); color:var(--ok); border-color:transparent}
select.statut[data-s="Candidature rejetée"]{background:var(--bad-soft); color:var(--bad); border-color:transparent}

input.notes{
  width:100%; min-width:150px; font:inherit; font-size:13px; padding:6px 8px;
  border:1px solid transparent; border-radius:7px; background:transparent; color:var(--ink);
}
input.notes:hover{border-color:var(--line)}
input.notes:focus{background:var(--surface-2); border-color:var(--line-2)}
input.notes::placeholder{color:var(--ink-3)}

.when{font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11.5px; color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums}
.when .src{display:block; color:var(--ink-3); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em}
.go{color:var(--accent); text-decoration:none; font-size:15px; padding:4px; border-radius:6px; display:inline-block}
.go:hover{text-decoration:underline}

.empty{
  text-align:center; color:var(--ink-2); padding:44px 20px; margin:0;
  background:var(--surface); border:1px dashed var(--line-2); border-radius:var(--radius); font-size:14px;
}
.note{
  background:var(--surface-2); border:1px solid var(--line); border-left:3px solid var(--star);
  border-radius:8px; padding:10px 13px; font-size:13px; color:var(--ink-2);
}
footer{color:var(--ink-3); font-size:12px; border-top:1px solid var(--line); padding-top:14px; line-height:1.6}
footer code{font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11.5px; color:var(--ink-2)}

.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:var(--ink); color:var(--ground); padding:9px 16px; border-radius:999px;
  font-size:13px; box-shadow:var(--shadow); z-index:9; max-width:88vw;
}

:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}

@media (max-width:760px){
  .wrap{padding:22px 14px 48px}
  .masthead h1{font-size:31px}
  .tablewrap{border:0; background:transparent; box-shadow:none; overflow-x:visible}
  table, tbody, tr, td{display:block; width:100%; min-width:0}
  thead{display:none}
  tbody tr{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:10px; padding:12px 13px; display:grid; gap:9px;
    grid-template-columns:auto 1fr auto; align-items:center; box-shadow:var(--shadow);
  }
  tbody td{border:0; padding:0}
  td.c-fav{grid-column:1; grid-row:1}
  td.c-poste{grid-column:2; grid-row:1}
  td.c-score{grid-column:3; grid-row:1; text-align:right}
  td.c-statut{grid-column:1 / -1}
  td.c-notes{grid-column:1 / -1}
  td.c-when{grid-column:1 / 3}
  td.c-go{grid-column:3; text-align:right}
  input.notes{border-color:var(--line); background:var(--surface-2)}
}
</style>

<script id="app">
(function(){
  "use strict";

  var FONTS = "https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap";
  var STATUTS = ["À traiter","Postulée","Contacts en cours","Candidature rejetée","Exclue"];

  var state = JSON.parse(document.getElementById("state").textContent);
  if(!state.offres) state.offres = [];

  var api = null;          // artifact namespace, null = lecture seule
  var writable = true;     // passe à false sur not_writer / not_granted
  var timer = null;
  var view = { q:"", statut:"tous", favOnly:false };

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function matches(o){
    if(view.favOnly && !o.favori) return false;
    if(view.statut === "tous"){ if(o.statut === "Exclue") return false; }
    else if(o.statut !== view.statut) return false;
    if(view.q){
      var hay = (o.titre + " " + (o.entreprise||"") + " " + (o.lieu||"") + " " + (o.notes||"")).toLowerCase();
      if(hay.indexOf(view.q.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function sorted(list){
    return list.slice().sort(function(a,b){
      if(a.favori !== b.favori) return a.favori ? -1 : 1;
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.score||0) - (a.score||0);
    });
  }

  function counts(){
    var c = { total:state.offres.length, favoris:0 };
    STATUTS.forEach(function(s){ c[s] = 0; });
    state.offres.forEach(function(o){
      if(o.favori) c.favoris++;
      if(c[o.statut] !== undefined) c[o.statut]++;
    });
    return c;
  }

  function render(){
    var c = counts();
    var rows = sorted(state.offres.filter(matches));
    var h = "";

    h += '<header class="masthead">'
      +    '<div><h1>Pipeline candidatures</h1>'
      +    '<p class="sub">Veille Business Analyst / Product Owner &mdash; Nantes M&eacute;tropole</p></div>'
      +    '<div class="stamp">' + (state.maj ? "dernier ajout " + esc(state.maj) : "aucun ajout") + "<br>"
      +      c.total + ' offre' + (c.total > 1 ? "s" : "") + ' suivie' + (c.total > 1 ? "s" : "")
      +    '</div></header>';

    h += '<section class="stats">'
      +   stat(c["À traiter"], "À traiter", "accent")
      +   stat(c.favoris, "Favoris", "star")
      +   stat(c["Postulée"], "Postulées", "")
      +   stat(c["Contacts en cours"], "Contacts en cours", "ok")
      +   stat(c["Candidature rejetée"], "Refus", "")
      +   stat(c["Exclue"], "Écartées", "")
      + '</section>';

    h += '<div class="toolbar">'
      +   '<div class="search"><input type="search" id="q" placeholder="Rechercher un poste, une entreprise, une note&hellip;" value="' + esc(view.q) + '"></div>'
      +   '<div class="chips" id="chips">' + chip("tous","Tout", c.total - c["Exclue"])
      +     STATUTS.map(function(s){ return chip(s, s, c[s]); }).join("")
      +   '</div>'
      +   '<button class="chip" id="favbtn" aria-pressed="' + (view.favOnly ? "true" : "false") + '">&#9733; Favoris</button>'
      + '</div>';

    if(!writable){
      h += '<div class="note">Lecture seule : les modifications faites ici ne seront pas enregistr&eacute;es.</div>';
    }

    if(!state.offres.length){
      h += '<p class="empty">Aucune offre pour l\'instant.<br>La veille quotidienne ajoutera ici chaque offre atteignant 50 points.</p>';
    } else if(!rows.length){
      h += '<p class="empty">Aucune offre ne correspond &agrave; ce filtre.</p>';
    } else {
      h += '<div class="tablewrap"><table><thead><tr>'
        +   '<th></th><th>Poste</th><th>Score</th><th>Statut</th><th>Notes</th><th>Rep&eacute;r&eacute;e</th><th></th>'
        +   '</tr></thead><tbody>' + rows.map(row).join("") + '</tbody></table></div>';
    }

    h += '<footer>Ce tableau est la m&eacute;moire de la veille : une offre y entre une fois et n\'en sort jamais. '
      +  'Le statut, le favori et les notes sont &agrave; vous &mdash; la routine quotidienne ne fait qu\'ajouter des lignes.<br>'
      +  'Source des offres : APEC et France&nbsp;Travail, via <code>veille.py</code>.</footer>';

    document.getElementById("wrap").innerHTML = h;
    bind();
  }

  function stat(n, label, tone){
    return '<div class="stat"' + (tone ? ' data-tone="' + tone + '"' : "") + '>'
      + '<span class="n">' + (n || 0) + '</span><span class="l">' + esc(label) + "</span></div>";
  }

  function chip(val, label, n){
    var on = view.statut === val && !view.favOnly ? "true" : "false";
    return '<button class="chip" data-statut="' + esc(val) + '" aria-pressed="' + on + '">'
      + esc(label) + ' <span class="c">' + (n || 0) + "</span></button>";
  }

  function row(o){
    var opts = STATUTS.map(function(s){
      return '<option value="' + esc(s) + '"' + (o.statut === s ? " selected" : "") + ">" + esc(s) + "</option>";
    }).join("");
    var ent = o.entreprise ? esc(o.entreprise) : '<span class="none">entreprise non communiqu&eacute;e</span>';
    return '<tr data-url="' + esc(o.url) + '"' + (o.statut === "Exclue" ? ' data-exclue="1"' : "") + ">"
      + '<td class="c-fav"><button class="fav" aria-pressed="' + (o.favori ? "true" : "false")
      +   '" aria-label="Marquer comme favori">' + (o.favori ? "&#9733;" : "&#9734;") + "</button></td>"
      + '<td class="c-poste"><div class="poste"><span class="t">' + esc(o.titre) + "</span>"
      +   '<span class="e">' + ent + (o.lieu ? " &middot; " + esc(o.lieu) : "") + "</span></div></td>"
      + '<td class="c-score"><span class="score" data-hi="' + (o.score >= 70 ? "1" : "0") + '">' + (o.score || 0) + "</span></td>"
      + '<td class="c-statut"><select class="statut" data-s="' + esc(o.statut) + '" aria-label="Statut">' + opts + "</select></td>"
      + '<td class="c-notes"><input class="notes" type="text" value="' + esc(o.notes) + '" placeholder="Notes&hellip;" aria-label="Notes"></td>'
      + '<td class="c-when"><span class="when">' + esc(o.date) + '<span class="src">' + esc(o.source) + "</span></span></td>"
      + '<td class="c-go"><a class="go" href="' + esc(o.url) + '" target="_blank" rel="noopener" aria-label="Ouvrir l\'offre">&#8599;</a></td>'
      + "</tr>";
  }

  function find(url){
    for(var i = 0; i < state.offres.length; i++){ if(state.offres[i].url === url) return state.offres[i]; }
    return null;
  }

  function bind(){
    var q = document.getElementById("q");
    if(q) q.addEventListener("input", function(){ view.q = this.value; var p = this.selectionStart; render();
      var n = document.getElementById("q"); if(n){ n.focus(); try{ n.setSelectionRange(p, p); }catch(e){} } });

    Array.prototype.forEach.call(document.querySelectorAll(".chip[data-statut]"), function(b){
      b.addEventListener("click", function(){ view.statut = b.getAttribute("data-statut"); view.favOnly = false; render(); });
    });
    var fb = document.getElementById("favbtn");
    if(fb) fb.addEventListener("click", function(){ view.favOnly = !view.favOnly; render(); });

    Array.prototype.forEach.call(document.querySelectorAll("tr[data-url]"), function(tr){
      var o = find(tr.getAttribute("data-url"));
      if(!o) return;

      var fav = tr.querySelector(".fav");
      fav.disabled = !writable;
      fav.addEventListener("click", function(){
        if(!writable) return;
        o.favori = !o.favori;
        fav.setAttribute("aria-pressed", o.favori ? "true" : "false");
        fav.innerHTML = o.favori ? "&#9733;" : "&#9734;";
        save(400);
      });

      var sel = tr.querySelector(".statut");
      sel.disabled = !writable;
      sel.addEventListener("change", function(){
        if(!writable) return;
        o.statut = sel.value;
        sel.setAttribute("data-s", o.statut);
        tr.setAttribute("data-exclue", o.statut === "Exclue" ? "1" : "");
        save(400);
      });

      var nt = tr.querySelector(".notes");
      nt.disabled = !writable;
      nt.addEventListener("input", function(){ if(writable){ o.notes = nt.value; save(1600); } });
      nt.addEventListener("blur", function(){ if(writable){ o.notes = nt.value; save(250); } });
    });
  }

  function buildDoc(){
    var css = document.getElementById("css").textContent;
    var app = document.getElementById("app").textContent;
    var json = JSON.stringify(state).replace(/<\//g, "<\\/");
    var END = "<" + "/script>";
    return '<!doctype html>\n<html lang="fr">\n<head>\n<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
      + "<title>Pipeline candidatures</title>\n"
      + '<link rel="preconnect" href="https://fonts.googleapis.com">\n'
      + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
      + '<link rel="stylesheet" href="' + FONTS + '">\n'
      + '<style id="css">' + css + "</style>\n</head>\n<body>\n"
      + '<div class="wrap" id="wrap"></div>\n'
      + '<script type="application/json" id="state">' + json + END + "\n"
      + '<script id="app">' + app + END + "\n</body>\n</html>";
  }

  function save(delay){
    if(!api || !writable) return;
    clearTimeout(timer);
    timer = setTimeout(publish, delay);
  }

  function publish(){
    if(!api || !writable) return;
    api.publish(buildDoc()).catch(function(err){
      var code = err && err.code;
      if(code === "conflict") return;                 // la vue se recharge sur la version gagnante
      if(code === "not_writer" || code === "not_granted" || code === "not_declared"){
        writable = false; render(); return;
      }
      if(code === "rate_limited"){ save(4000); return; }
      toast("Modification non enregistrée. Elle sera perdue au rechargement.");
    });
  }

  function toast(msg){
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 5200);
  }

  render();

  (async function(){
    try{
      api = (window.claude && claude.use) ? await claude.use("artifact") : null;
    }catch(e){ api = null; }
    if(!api){ writable = false; render(); }
  })();
})();
</script>
