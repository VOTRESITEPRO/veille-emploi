# =============================================================
# Veille offres PO / Chef de projet - Nantes
# Ce fichier est lu par veille.py (sections requete / filtres_durs)
# et par la routine Claude (section scoring).
# =============================================================

requete:
  # Mots-cles envoyes aux deux sources. Volontairement larges :
  # le tri fin est fait par le scoring, pas par la requete.
  mots_cles:
    - "product owner"
    - "proxy product owner"
    - "chef de produit IT"
    - "chef de projet IT"
    - "chef de projet informatique"
    - "chef de projet agile"
    - "chef de projet fonctionnel web"
    - "chef de projet internet"
    - "chef de projet digital"
    - "gestionnaire de projet"
    - "responsable d'application"

  departement: "44"
  # Rayon en km autour de Nantes, utilise par France Travail
  commune_insee: "44109"   # Nantes
  rayon_km: 30
  # Libelle affiche pour la commune ci-dessus, utilise par HelloWork (le
  # parametre l_autocomplete de sa recherche encode deja commune_insee ;
  # ce libelle doit rester coherent si tu changes commune_insee).
  hellowork_lieu_label: "Nantes 44000"

  # Communes acceptees pour le filtre geographique dur (voir filtres_durs
  # ci-dessous). Critere : accessibilite sans traversee de la Loire
  # (trafic routier degrade sur les franchissements) - l'appartenance a
  # Nantes Metropole n'entre pas en compte. Une commune rive sud est
  # exclue meme si elle est dans la Metropole ou a moins de 30 km de
  # Coueron.
  # L'APEC ne fournit ni code postal ni coordonnees dans ses resultats de
  # recherche : impossible de calculer un vrai rayon de 30 km. Rejette a
  # tort quelques communes rive nord qui seraient en realite a moins de
  # 30 km de Coueron (ex. Vallet, Clisson) ; accepte a tort aucune commune
  # trop eloignee, ce qui est le sens dans lequel se tromper ici.
  communes_proches:
    - "Carquefou"
    - "Coueron"
    - "Indre"
    - "La Chapelle-sur-Erdre"
    - "Nantes"
    - "Orvault"
    - "Saint-Herblain"
    - "Saint-Etienne-de-Monluc"
    - "Sautron"

  # Codes ROME France Travail. M1806 = conseil et MOA en SI.
  # Laisser vide pour ne pas filtrer par ROME (recommande au demarrage :
  # beaucoup d'offres BA/PO sont mal codees par les recruteurs).
  codes_rome: []

  types_contrat:
    - "CDI"
  # Ajouter "CDD" ou "MIS" si tu veux elargir.

  # Nombre de jours d'anciennete max d'une offre
  anciennete_jours: 3

filtres_durs:
  # Une offre qui matche un seul de ces motifs dans son titre est ecartee
  # sans arriver jusqu'au scoring. Insensible a la casse.
  titre_exclu:
    - "alternan"
    - "apprenti"
    - "stage"
    - "stagiaire"
    - "\\bjunior\\b"
    - "d[ée]veloppeur"
    - "developpeur"
    - "ing[ée]nieur d[ée]veloppement"
    - "data engineer"
    - "data scientist"
    - "devops"
    - "administrateur syst"
    - "technicien"
    - "commercial"
    - "lead"
    - "\\bSIRH\\b"
    - "\\bSAP\\b"
    - "scrum master"
    - "business analyst"

  # Rejette si le salaire max annonce est sous ce seuil (en euros annuels).
  # Les offres sans salaire annonce passent le filtre.
  salaire_min_annuel: 45000

  # Rejette si le libelle d'experience exige depasse ce seuil (en annees).
  experience_max_exigee: 12

# =============================================================
# Grille de scoring - lue par Claude, pas par le script.
# Score sur 100. Seuil de retenue : 50.
# =============================================================
scoring:
  seuil_retenue: 50

  # Exclusif : retenir le premier palier qui correspond. Les paliers 35/28/22
  # exigent que le titre de l'offre dise litteralement "Product Owner" ou
  # "Chef de projet" (digital/IT/web/agile/fonctionnel) : un intitule
  # "Consultant fonctionnel" ou "Analyste fonctionnel" ne s'y qualifie
  # jamais, meme chez un client final ou avec un secteur pertinent, sauf
  # si la description decrit explicitement des missions de backlog /
  # user stories / pilotage de projets digitaux (alors palier 15).
  adequation_role:            # 0 a 35
    - [35, "Titre litteral 'Product Owner' ou 'Chef de projet' (digital/IT/web/agile/fonctionnel), sur produit web / e-commerce, chez le client final"]
    - [28, "Titre litteral 'Product Owner' ou 'Chef de projet' (digital/IT/web/agile/fonctionnel), generaliste SI, chez le client final"]
    - [22, "Titre litteral 'Product Owner' ou 'Chef de projet' (digital/IT/web/agile/fonctionnel), en ESN ou cabinet de conseil, mission identifiee"]
    - [15, "AMOA, analyste fonctionnel, ou role sans titre PO/Chef de projet dont la description mentionne explicitement backlog, user stories, ou pilotage de projets digitaux"]
    - [8,  "Chef de projet ERP/informatique generique sans autre indice (secteur, stack ou mission non precises) ; role hybride ou mal defini"]
    - [0,  "Le role n'est pas un role de PO/Chef de projet : developpement, infrastructure, ou poste de direction/executif (CPO, Head of Product, directeur, VP)"]

  proximite_metier:           # 0 a 25
    - [25, "E-commerce, retail, distribution, marketplace, B2B"]
    - [18, "Industrie, logistique, transport, tourisme"]
    - [12, "Editeur logiciel, service public, sante"]
    - [6,  "Banque, assurance, data pure"]
    - [0,  "Secteur incompatible ou non identifiable"]

  socle_technique:            # 0 a 20
    - [20, "PHP, JavaScript, HTML, CSS, SQL, Python/Selenium, Jira, Google Workspace, Microsoft 365, Claude AI explicitement cites"]
    - [14, "Environnement web technique sans stack precise"]
    - [8,  "Stack differente mais culture technique attendue"]
    - [0,  "Profil purement fonctionnel sans dimension technique"]

  # Cumulatif, plafonne a 20.
  conditions:
    - [8, "Statut cadre explicite"]
    - [6, "Fourchette annoncee compatible 45-55k"]
    - [4, "Poste dans Nantes Metropole (pas seulement 44)"]
    - [2, "Teletravail partiel mentionne"]

  # Penalites cumulatives, non plafonnees.
  signaux_negatifs:
    - [-10, "Deplacements frequents ou mobilite nationale exigee"]
    - [-8,  "Anglais courant requis a l'ecrit ET a l'oral en usage quotidien"]
    - [-5,  "Annonce d'ESN sans nom de client ni mission decrite"]
    - [-5,  "Offre republiee a l'identique depuis plus de 30 jours"]

  # Contexte a rappeler dans la synthese quand il s'applique
  notes_contexte:
    banque_assurance: >
      Secteur dominant sur le bassin nantais mais eloigne du profil
      retail / e-commerce B2B. Ne pas ecarter : signaler que la
      candidature demande un travail de transposition explicite.
    esn: >
      Verifier si la mission est identifiee. Une annonce ESN sans
      client nomme a une valeur d'information faible.

profil:
  # Rappel factuel utilise par Claude pour le scoring.
  # A ne pas embellir : ce bloc sert a juger, pas a vendre.
  intitule_cible: "Chef de projet digital / Product Owner, statut cadre"
  localisation: "Couëron (44), Nantes Metropole, rayon 30 km"
  disponibilite: "septembre 2026"
  remuneration_affichee: "45-55k euros"
  experience: "20 ans web, dont 6 ans Product Owner / Chef de projet / Responsable d'applications sur refonte e-commerce B2B"
  domaine_fort: "e-commerce B2B, distribution, retail"
  stack: "PHP, JavaScript, HTML, CSS, SQL, Python/Selenium, Jira, Google Workspace, Microsoft 365, Claude AI"
  methodes: "cycle en V, Scrum, Kanban, MoSCoW, MOA/AMOA"
  certification: "Certificat Professionnel Gestion de projet Google en preparation"
